# descriptive: find it and understand it
id: arched-canopy-with-two-hanging-cages
title: Arched canopy with two hanging cages
description: >-
  A wide panel of thin architecture inside a ruled border. A round arch on a stepped entablature carries three vases; under it hangs a long fringed drapery with pendant drops, flanked by two slender female terms whose bodies taper into tassels, with two more terms at the outer edges. On each side a domed cage with a fringed valance hangs from the cornice, enclosing a vase that gives off a twist of smoke, above a half-round base. Foliate scrolls with lily flowers and spiky tufts sit on the entablature; bead chains with tassels hang below. Single dark gray ink; the background is transparent.
