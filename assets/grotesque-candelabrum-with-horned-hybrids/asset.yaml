# descriptive: find it and understand it
id: grotesque-candelabrum-with-horned-hybrids
title: Grotesque candelabrum with trophies, a boat and horned hybrids
description: >-
  A tall upright panel in a ruled border, a faint impression. Two winged genii read books at the top corners of a rod hung with trophies of arms and tablets; an armour trophy stands above a crescent boat with ram-head prows carrying two nude figures. A winged woman holding two long trumpets is flanked by rearing horses on cups raised by reclining nudes; below her a crested term lifts two cornucopias between two horned, bearded, horse-bodied hybrids. A frieze of a triumph with elephants, a winged mask and two dragons held by nude figures close the base. Pale warm gray ink; transparent background.
