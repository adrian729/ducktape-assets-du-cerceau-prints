# descriptive: find it and understand it
id: garlanded-grotesque-with-musicians-and-mask
title: Grotesque with eagles, musicians and a bearded mask
description: >-
  A tall upright panel in a thin ruled border. Two eagles with spread wings hold bead garlands at the top corners beside a winged female half-figure, hatched tablets hanging below. Bearded foliate scrolls carry a horned satyr with a pipe and a man playing a lyre. A bat-winged, goat-headed creature spreads over a grinning bearded mask above a frieze of tiny figures. Two cranes fly in over a swag to an oval cartouche; two goat-legged satyrs blow pipes on a pedestal with a dark niche, between crossed instruments, torches, urns and two sphinxes. Warm dark gray ink; transparent background.
