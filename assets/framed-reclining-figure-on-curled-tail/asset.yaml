id: framed-reclining-figure-on-curled-tail
title: Framed reclining figure over a curled tail
description: >-
  A small framed vignette cropped from a grotesque panel: a nude figure reclines to the left, propped on one elbow with the head at the left, its legs stretched over a creature whose tail curls up at the right. Thick, soft dark lines inside a double-ruled rectangle and a diagonally hatched frame band; the background is transparent.
