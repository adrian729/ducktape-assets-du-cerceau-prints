# descriptive: find it and understand it
id: grotesque-canopy-with-suspended-miniature
title: Stepped canopy with bird cages and a horsemen miniature
description: >-
  A wide panel inside a ruled border. A stepped strapwork frame holds a small hatched miniature of galloping horsemen at the centre, under a half-dome lunette and two foliate C-scrolls. On either side a domed bird cage with a bird inside hangs from the upper rule between fluttering ribbons, and a bird perches on the rule beside a tall tapering vase at each outer end. Below, a slender female term stands between bead swags with tassels, and a dotted shield cartouche with pendant drops hangs under a foliate bracket at each side. Single dark gray ink; the background is transparent.
