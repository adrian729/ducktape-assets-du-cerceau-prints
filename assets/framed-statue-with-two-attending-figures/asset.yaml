id: framed-statue-with-two-attending-figures
title: Framed statue with two standing attendants
description: >-
  A small upright framed vignette cropped from a grotesque panel: a nude statue holding a tall spear stands on a round pedestal, and two draped figures stand at either side of it, the right one reaching up toward it. Thick, soft dark lines inside a double-ruled rectangle and a diagonally hatched frame band; the background is transparent.
