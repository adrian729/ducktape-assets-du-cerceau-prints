id: tall-canopy-with-framed-figure-and-winged-mask
title: Tall canopy with a niche figure and a winged siren
description: >-
  A tall upright panel in a ruled border. At the top a fringed pavilion canopy with draperies held by two small nude figures; below it a deep perspectival box niche holds a standing nude woman with a staff under a leafy arch, with rows of hanging flower drops. A strapwork cartouche with a feather-crowned mask follows, then two flaming lamp-stands on tripods with hanging cloths and tassels. At the bottom a winged female figure ending in a scroll tail rests on foliate volutes between two flowering shrubs, over a stepped plinth with two tiny swan heads. Single dark gray ink; transparent background.
type: ornament
