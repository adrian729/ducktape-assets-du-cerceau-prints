# descriptive: find it and understand it
id: grotesque-with-paired-hybrids-and-scene
title: Hunting miniature between two bending satyrs
description: >-
  A near-square panel in a stepped ruled border. At the centre a rectangular miniature of a hunt (a horseman, an archer, a seated figure and a dog) sits in a strapwork frame hung with bead chains; above it a lion mask in foliate scrolls between two spiky tufts, with a basket of fruit and bead garlands at the top. Two nude satyr-like figures with scroll legs bend backwards on either side, each holding up a smoking bowl. Pendant canopies with medallions, tassels and fans of wheat-like plumes fill the outer columns; a small doorway opens at the bottom. Single dark gray ink; transparent background.
