# descriptive: find it and understand it
id: foliate-face-with-paired-perching-birds
title: Feathered mask between two perched birds
description: >-
  A wide panel inside a ruled border. At the centre a mask with a feathered crown hangs from a knotted scroll bracket, a bead chain swagging below it to a small foliate drop; a lily-like flower rises from a volute on either side and a moth hovers beside each cheek. Two fringed pagoda canopies hang from wavy cords at the sides. On low plinths at the lower corners sit two plump birds seen from behind, heads turned inward, a cloth draped over each perch. Single dark gray ink with hatched shading; the background is transparent.
