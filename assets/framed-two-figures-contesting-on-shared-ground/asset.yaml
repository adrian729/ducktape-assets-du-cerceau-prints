id: framed-two-figures-contesting-on-shared-ground
title: Framed standing figure over a crouching figure
description: >-
  A small framed vignette cropped from a grotesque panel: a nude figure stands at the right with both arms flung up and the head turned to the left, one leg thrust against a second nude figure crouching at the left. Thick, soft dark lines inside a double-ruled rectangle and a diagonally hatched frame band; the background is transparent.
