# descriptive: find it and understand it
id: tall-grotesque-with-dragons-and-paired-griffins
title: Tall grotesque with winged dragons and griffins
description: >-
  A tall upright panel in a ruled border. Bead garlands swag from the top, held by two birds flying down; thin candelabrum stems with lantern-shaped vases run down both sides. Two winged, bird-headed dragons with curling scaly tails face inward in the upper register, moths between them; below, two griffins perch on a wide footed bowl holding leafy sprays. A strapwork cartouche holds an oval miniature of a reclining figure. Under a scalloped half-dome two seated griffins face each other across a mask; a winged mask closes the bottom. Single dark gray ink; transparent background.
type: ornament
