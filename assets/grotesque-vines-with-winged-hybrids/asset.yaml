# descriptive: find it and understand it
id: grotesque-vines-with-winged-hybrids
title: Grotesque vines crowded with figures and hybrids
description: >-
  A tall upright panel in a ruled border, filled asymmetrically with scrolling vines. A winged putto rides a cornucopia at the top left; a leaping stag, a crane and two figures on a pedestal fill the top right; a nude man with sword and round shield strides over a scroll. A winged female bust tops the central stem above a bearded man seated over a framed miniature; a fringed canopy hangs at the right with figures swinging from its cords. A dog-headed dragon, a satyr piper, a winged siren, a boy in a hoop, a goat and a reclining man fill the lower half. Warm gray ink; transparent background.
