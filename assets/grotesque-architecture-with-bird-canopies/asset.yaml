# descriptive: find it and understand it
id: grotesque-architecture-with-bird-canopies
title: Grotesque architecture with satyrs, framed scenes and niches
description: >-
  A tall upright panel in a ruled border. Three winged busts on vases top thin scroll stems; a goose and a parrot-like bird perch on fringed canopies at the corners. Under a leafy arch with a mask at its crown two satyrs dance around a staff twined by two snakes, a basket of fruit hanging below; slender candelabra and two amphorae stand at the sides. Six hatched frames with figure scenes are stacked three per side. The base is a strapwork frieze of diamonds and dolphins with four arched niches holding standing figures between serpents. Warm dark gray ink; transparent background.
